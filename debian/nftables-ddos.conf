#!/usr/sbin/nft -f
# debian/nftables-ddos.conf — DDoS/flood mitigation profile (ch.08 §10).
# Rate-limit inbound connection attempts and drop oversized bursts before
# they reach bridge daemons or the container. Fail-closed like every HALIDE
# profile: unknown inbound traffic is dropped, logged, and counted.
flush ruleset

table inet halide_ddos {

    chain input {
        type filter hook input priority 0; policy drop;
        ct state established,related accept
        iifname "lo" accept
        # SYN flood protection: rate-limit new TCP + drop after 100/s burst.
        tcp flags syn limit rate over 100/second drop
        # ICMP echo sanity: allow a little, drop floods.
        ip protocol icmp icmp type echo-request limit rate 10/second accept
        ip protocol icmp drop
        # UDP flood sanity: drop unmatched UDP to host services outright.
        udp dport != 53 drop
        log prefix "halide-ddos-drop: "
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        iifname "veth-halide" limit rate 2000/second accept
        iifname "veth-halide" log prefix "halide-ddos-container-flood: " drop
    }
}
