#!/usr/sbin/nft -f
# debian/nftables-tor.conf — TOR reroute egress profile (ch.08 §16 kill-switch,
# extended): ALL container egress must enter the local onion router's
# TransPort (9040) — direct public sockets are dropped + logged.
# Host itself only talks to Tor entry nodes; DNS never leaves plaintext.
# Enable: netd MODE tor (bridges/netd_bridge.py) then load this ruleset.
flush ruleset

table inet halide {
    set bridge-host {
        type ipv4_addr
        # Host end of the container veth (filled at image build, e.g. 10.0.3.1).
    }

    chain container-egress {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        # Container -> local tor TransPort only.
        iifname "veth-halide" ip daddr @bridge-host tcp dport 9040 accept
        # DNS only via tor DNSPort; raw DNS from the container is a
        # deanon-leak — dropped, not routed.
        iifname "veth-halide" ip daddr @bridge-host udp dport 9053 accept
        iifname "veth-halide" log prefix "halide-tor-kill: " drop
    }

    chain output {
        type filter hook output priority 0; policy drop;
        ct state established,related accept
        oifname "lo" accept
        # Host egress ONLY to tor entry guards (tor subprocess owns its own
        # route via uid-match in production; stub here).
        tcp dport { 9001, 9030 } accept
        log prefix "halide-tor-egress-kill: " drop
    }
}
